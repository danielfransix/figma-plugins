<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figma Arrow Manager</title>
<script>
  try {
    window.localStorage.getItem('x')
  } catch (e) {
    const store = new Map()
    const shim = {
      getItem: (k) => (store.has(k) ? store.get(k) : null),
      setItem: (k, v) => { store.set(k, String(v)) },
      removeItem: (k) => { store.delete(k) },
      clear: () => { store.clear() },
      key: (i) => Array.from(store.keys())[i] ?? null,
      get length() { return store.size },
    }
    Object.defineProperty(window, 'localStorage', { value: shim, configurable: true })
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root {
  /* Sourced from Figma's own injected theme (figma.showUI({ themeColors: true })),
     so this plugin's colors auto-match the user's actual light/dark Figma theme
     instead of a guessed fixed palette. Fallbacks only apply if that ever fails. */
  --color-bg:             var(--figma-color-bg, #2C2C2C);
  --color-bg-secondary:   var(--figma-color-bg-secondary, #383838);
  --color-border:         var(--figma-color-border, #444444);
  --color-border-strong:  var(--figma-color-border-strong, #555555);
  --color-text:           var(--figma-color-text, #FFFFFF);
  --color-text-secondary: var(--figma-color-text-secondary, rgba(255,255,255,0.7));
  --color-text-tertiary:  var(--figma-color-text-tertiary, rgba(255,255,255,0.4));
  --color-text-onbrand:   var(--figma-color-text-onbrand, #FFFFFF);
  --color-bg-brand:       var(--figma-color-bg-brand, #0C8CE9);
  --color-bg-brand-hover: var(--figma-color-bg-brand-hover, #006dcf);
  --color-danger:         var(--figma-color-text-danger, #ff6b6b);

  --font-title-size: 12px;
  --font-title-lh:   16px;
  --font-body-size:  11px;
  --font-body-lh:    16px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
  font-size: var(--font-body-size);
  line-height: var(--font-body-lh);
  background: var(--color-bg);
  color: var(--color-text);
  -webkit-user-select: none;
  user-select: none;
}

.plugin-wrap {
  display: flex;
  flex-direction: column;
  background: var(--color-bg);
  min-height: 100vh;
}

.content-header {
  padding: 12px 16px 6px;
  flex-shrink: 0;
}
.header-title {
  font-weight: 600;
  font-size: var(--font-title-size);
  line-height: var(--font-title-lh);
}

.section { display: flex; flex-direction: column; padding: 10px 16px 12px; gap: 8px; }

.helper {
  font-size: var(--font-body-size);
  color: var(--color-text-secondary);
  line-height: var(--font-body-lh);
}

.status-box {
  padding: 8px 10px;
  background: var(--color-bg-secondary);
  border-radius: 6px;
  border: 1px solid var(--color-border);
  font-size: var(--font-body-size);
  color: var(--color-text-secondary);
  line-height: var(--font-body-lh);
  word-break: break-word;
}
.status-box.ready { color: var(--color-text); }
.status-box.warn { color: var(--color-danger); }

.btn-primary {
  background: var(--color-bg-brand);
  border: none;
  border-radius: 6px;
  color: var(--color-text-onbrand);
  font-size: var(--font-body-size);
  font-weight: 500;
  font-family: inherit;
  padding: 8px 14px;
  cursor: pointer;
  transition: background 0.1s, opacity 0.1s;
}
.btn-primary:hover:not(:disabled) { background: var(--color-bg-brand-hover); }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-primary.full-width { width: 100%; }

.btn-secondary {
  background: transparent;
  border: 1px solid var(--color-border);
  border-radius: 6px;
  color: var(--color-text);
  font-size: var(--font-body-size);
  font-family: inherit;
  padding: 7px 12px;
  cursor: pointer;
  transition: background 0.1s, border-color 0.1s;
  white-space: nowrap;
}
.btn-secondary:hover { background: var(--color-bg-secondary); border-color: var(--color-border-strong); }
.btn-secondary.full-width { width: 100%; }

.divider { height: 1px; background: var(--color-border); margin: 0 16px; }

.row-2col { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.row-2col > label { color: var(--color-text-secondary); flex: 1; min-width: 0; }
.row-2col > .control { flex-shrink: 0; }

/* ── Toggle switch ── */
.switch { position: relative; display: inline-block; width: 28px; height: 16px; flex-shrink: 0; }
.switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.switch-track { position: absolute; inset: 0; background: var(--color-border-strong); border-radius: 999px; transition: background 0.15s; pointer-events: none; }
.switch-thumb { position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; background: #fff; border-radius: 50%; transition: transform 0.15s; }
.switch input:checked + .switch-track { background: var(--color-bg-brand); }
.switch input:checked + .switch-track .switch-thumb { transform: translateX(12px); }

/* ── Color picker ── */
.color-field {
  display: flex;
  align-items: center;
  gap: 2px;
  background: var(--color-bg-secondary);
  border: 1px solid var(--color-border);
  border-radius: 6px;
  padding: 3px;
  transition: border-color 0.1s;
}
.color-field:focus-within { border-color: var(--color-bg-brand); }

.color-swatch {
  position: relative;
  display: block;
  width: 22px;
  height: 22px;
  border-radius: 4px;
  overflow: hidden;
  border: 1px solid var(--color-border-strong);
  box-shadow: inset 0 0 0 1px rgba(0,0,0,0.15);
  flex-shrink: 0;
  cursor: pointer;
}
.color-swatch:hover { border-color: var(--color-bg-brand); }
.color-fill { position: absolute; inset: 0; pointer-events: none; }
.color-input {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  padding: 0;
  border: none;
  background: none;
  cursor: pointer;
  opacity: 0;
}

.color-hex {
  width: 58px;
  background: none;
  border: none;
  color: var(--color-text);
  font-family: 'JetBrains Mono', Consolas, monospace;
  font-size: var(--font-body-size);
  text-transform: uppercase;
  letter-spacing: 0.3px;
  padding: 4px 4px 4px 2px;
}
.color-hex:focus { outline: none; }

.color-hash {
  color: var(--color-text-tertiary);
  font-family: 'JetBrains Mono', Consolas, monospace;
  font-size: var(--font-body-size);
  padding-left: 2px;
}

/* ── Weight stepper ── */
.stepper {
  display: flex;
  align-items: stretch;
  background: var(--color-bg-secondary);
  border: 1px solid var(--color-border);
  border-radius: 6px;
  overflow: hidden;
  width: 92px;
  flex-shrink: 0;
  transition: border-color 0.1s;
}
.stepper:focus-within { border-color: var(--color-bg-brand); }
.stepper-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  border: none;
  background: none;
  color: var(--color-text-secondary);
  cursor: pointer;
  transition: background 0.1s, color 0.1s;
  flex-shrink: 0;
}
.stepper-btn:hover { background: var(--color-border); color: var(--color-text); }
.stepper-btn:active { background: var(--color-border-strong); }
.stepper-input {
  flex: 1;
  min-width: 0;
  text-align: center;
  background: none;
  border: none;
  border-left: 1px solid var(--color-border);
  border-right: 1px solid var(--color-border);
  color: var(--color-text);
  font-family: inherit;
  font-size: var(--font-body-size);
  padding: 0 2px;
}
.stepper-input:focus { outline: none; background: var(--color-bg); }

/* ── Scrollbars ── */
* { scrollbar-width: thin; scrollbar-color: var(--color-text-tertiary) transparent; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--color-text-tertiary); border-radius: 999px; border: none; }
::-webkit-scrollbar-thumb:hover { background: var(--color-text-secondary); }
::-webkit-scrollbar-corner { background: transparent; }

/* ── Log panel ── */
.log-list {
  max-height: 88px;
  overflow-y: auto;
  background: var(--color-bg-secondary);
  border: 1px solid var(--color-border);
  border-radius: 6px;
  padding: 8px 10px;
  font-family: 'JetBrains Mono', Consolas, monospace;
  font-size: var(--font-body-size);
  line-height: var(--font-body-lh);
}
.log-empty { color: var(--color-text-secondary); }
.log-entry { color: var(--color-text-secondary); white-space: pre-wrap; word-break: break-word; }
.log-entry.error { color: var(--color-danger); }
.log-entry .log-time { color: var(--color-text-tertiary); margin-right: 6px; }

/* ── Footer ── */
.footer {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px 12px;
  border-top: 1px solid var(--color-border);
  flex-shrink: 0;
}
.footer .btn-primary { flex: 1; }
</style>
</head>
<body>
<div class="plugin-wrap" id="plugin-wrap">

  <div class="content-header">
    <span class="header-title">Figma Arrow Manager</span>
  </div>

  <!-- Connect elements -->
  <div class="section">
    <p class="helper">Paste one connector, then select it with the two elements you want to connect.</p>
    <div class="status-box" id="selection-status">Nothing selected</div>
    <button type="button" class="btn-primary full-width" id="connect-btn" disabled>Connect selected</button>
  </div>

  <div class="divider"></div>

  <!-- Show connector arrows -->
  <div class="section">
    <div class="row-2col">
      <label id="visibility-label">Toggle visibility · 0 connectors</label>
      <div class="switch control">
        <input type="checkbox" id="visibility-toggle" checked aria-label="Show connector arrows">
        <span class="switch-track"><span class="switch-thumb"></span></span>
      </div>
    </div>
  </div>

  <!-- Connector colors -->
  <div class="section">
    <div class="row-2col">
      <label>Set all to one color</label>
      <div class="color-field control">
        <span class="color-swatch">
          <span class="color-fill" id="color-fill"></span>
          <input type="color" class="color-input" id="color-picker" value="#0D99FF" aria-label="Connector color" title="Connector color">
        </span>
        <span class="color-hash">#</span>
        <input type="text" class="color-hex" id="color-hex" value="0D99FF" maxlength="6" spellcheck="false" aria-label="Connector color hex value">
      </div>
    </div>
  </div>

  <!-- Thickness -->
  <div class="section">
    <div class="row-2col">
      <label>Weight</label>
      <div class="stepper control" id="weight-stepper">
        <button type="button" class="stepper-btn" id="weight-decrease" aria-label="Decrease weight">
          <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><line x1="1" y1="5" x2="9" y2="5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
        <input type="text" inputmode="decimal" class="stepper-input" id="weight-input" value="2" aria-label="Connector stroke weight">
        <button type="button" class="stepper-btn" id="weight-increase" aria-label="Increase weight">
          <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><line x1="5" y1="1" x2="5" y2="9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><line x1="1" y1="5" x2="9" y2="5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div class="divider"></div>

  <!-- Activity -->
  <div class="section">
    <label>Activity</label>
    <div class="log-list" id="log-list">
      <div class="log-empty">No activity yet.</div>
    </div>
    <button type="button" class="btn-secondary full-width" id="copy-log-btn">Copy log</button>
  </div>

  <div class="footer">
    <button type="button" class="btn-primary" id="apply-btn">Apply</button>
    <button type="button" class="btn-secondary" id="randomize-btn">Randomize colors</button>
  </div>

</div>

<script>
var pluginWrap = document.getElementById('plugin-wrap');
var selectionStatus = document.getElementById('selection-status');
var connectBtn = document.getElementById('connect-btn');
var visibilityToggle = document.getElementById('visibility-toggle');
var visibilityLabel = document.getElementById('visibility-label');
var colorPicker = document.getElementById('color-picker');
var colorFill = document.getElementById('color-fill');
var colorHex = document.getElementById('color-hex');
var weightInput = document.getElementById('weight-input');
var weightDecrease = document.getElementById('weight-decrease');
var weightIncrease = document.getElementById('weight-increase');
var applyBtn = document.getElementById('apply-btn');
var randomizeBtn = document.getElementById('randomize-btn');
var copyLogBtn = document.getElementById('copy-log-btn');
var logList = document.getElementById('log-list');

var logEntries = []; // { time, level, message }

connectBtn.addEventListener('click', function () {
  parent.postMessage({ pluginMessage: { type: 'connect' } }, '*');
});

visibilityToggle.addEventListener('change', function () {
  parent.postMessage({ pluginMessage: { type: 'toggle-visibility', show: visibilityToggle.checked } }, '*');
});

// ── Color swatch + hex sync ──
function setColor(hex) {
  hex = hex.toUpperCase();
  colorPicker.value = '#' + hex;
  colorFill.style.background = '#' + hex;
  colorHex.value = hex;
}

colorFill.style.background = colorPicker.value;

colorPicker.addEventListener('input', function () {
  setColor(colorPicker.value.replace('#', ''));
});

colorHex.addEventListener('change', function () {
  var v = colorHex.value.trim().replace('#', '');
  if (/^[0-9A-Fa-f]{6}$/.test(v)) {
    setColor(v);
  } else {
    colorHex.value = colorPicker.value.replace('#', '').toUpperCase();
  }
});

colorHex.addEventListener('focus', function () {
  colorHex.select();
});

// ── Weight stepper ──
var WEIGHT_MIN = 0.5, WEIGHT_MAX = 10, WEIGHT_STEP = 0.5;

function clampWeight(v) {
  if (isNaN(v)) v = WEIGHT_MIN;
  v = Math.round(v / WEIGHT_STEP) * WEIGHT_STEP;
  return Math.min(WEIGHT_MAX, Math.max(WEIGHT_MIN, v));
}

function setWeight(v) {
  v = clampWeight(v);
  weightInput.value = String(v);
  return v;
}

function getWeight() {
  return Number(weightInput.value);
}

weightInput.addEventListener('change', function () {
  setWeight(parseFloat(weightInput.value));
});

weightInput.addEventListener('focus', function () {
  weightInput.select();
});

weightDecrease.addEventListener('click', function () {
  setWeight(getWeight() - WEIGHT_STEP);
});

weightIncrease.addEventListener('click', function () {
  setWeight(getWeight() + WEIGHT_STEP);
});

applyBtn.addEventListener('click', function () {
  parent.postMessage({ pluginMessage: { type: 'apply-style', color: colorPicker.value, weight: getWeight() } }, '*');
});

randomizeBtn.addEventListener('click', function () {
  parent.postMessage({ pluginMessage: { type: 'randomize-colors' } }, '*');
});

copyLogBtn.addEventListener('click', copyLogs);

window.onmessage = function (event) {
  var msg = event.data.pluginMessage;
  if (!msg) return;
  if (msg.type === 'selection-status') renderSelection(msg);
  if (msg.type === 'connector-state') renderConnectorState(msg);
  if (msg.type === 'log') addLogEntry(msg);
};

function renderSelection(status) {
  connectBtn.disabled = !status.canConnect;
  if (status.count === 0) {
    selectionStatus.textContent = 'Nothing selected';
    selectionStatus.className = 'status-box';
  } else if (status.canConnect) {
    selectionStatus.textContent = status.count + ' selected — ' + status.names.join(', ');
    selectionStatus.className = 'status-box ready';
  } else {
    selectionStatus.textContent = status.count + ' selected — ' + status.names.join(', ');
    selectionStatus.className = 'status-box warn';
  }
  scheduleResize();
}

function renderConnectorState(state) {
  visibilityToggle.checked = state.shown;
  visibilityLabel.textContent = 'Toggle visibility · ' + state.count + ' connector' + (state.count === 1 ? '' : 's');
  scheduleResize();
}

function addLogEntry(entry) {
  logEntries.push(entry);
  var row = document.createElement('div');
  row.className = 'log-entry' + (entry.level === 'error' ? ' error' : '');
  var timeSpan = document.createElement('span');
  timeSpan.className = 'log-time';
  timeSpan.textContent = entry.time;
  row.appendChild(timeSpan);
  row.appendChild(document.createTextNode(entry.message));

  if (logList.querySelector('.log-empty')) logList.innerHTML = '';
  logList.appendChild(row);
  logList.scrollTop = logList.scrollHeight;
}

function copyLogs() {
  var text = logEntries.length
    ? logEntries.map(function (e) { return '[' + e.time + '] ' + e.level.toUpperCase() + ': ' + e.message; }).join('\n')
    : 'No activity yet.';

  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try {
    document.execCommand('copy');
  } catch (e) {}
  document.body.removeChild(ta);
}

// Auto-resize the plugin window to fit content (clamped in code.js to 80–900px)
var resizeTimer = null;
function scheduleResize() {
  if (resizeTimer) return;
  resizeTimer = setTimeout(function () {
    resizeTimer = null;
    var h = pluginWrap.getBoundingClientRect().height;
    parent.postMessage({ pluginMessage: { type: 'resize', height: Math.ceil(h) } }, '*');
  }, 30);
}

new ResizeObserver(scheduleResize).observe(pluginWrap);
scheduleResize();
</script>
</body>
</html>
