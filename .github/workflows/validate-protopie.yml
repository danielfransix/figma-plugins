name: Validate ProtoPie plugin
on:
  push:
    branches: [main]
    paths:
      - "figma-to-protopie/**"
      - ".github/workflows/validate-protopie.yml"
  pull_request:
    paths:
      - "figma-to-protopie/**"
      - ".github/workflows/validate-protopie.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        node: [20, 24]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: figma-to-protopie
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: figma-to-protopie/package-lock.json
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - if: matrix.node == 24
        run: npm run package -- --with-runtime
      - if: matrix.node == 24
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: plugin-${{ matrix.os }}
          path: figma-to-protopie/dist/*
