function buildOTSection(style) {
  var otf = style.openTypeFeatures || {};
  var wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex;flex-direction:column;';

  OT_GROUPS.forEach(function(grp) {
    var active = grp.tags.filter(function(t) { return otf[t]; });
    var subWrap = document.createElement('div');
    subWrap.style.cssText = 'border-bottom:1px solid var(--border-subtle);';
    var subHdr = document.createElement('div');
    subHdr.className = 'ot-subhdr' + (active.length ? ' open' : '');
    subHdr.style.cssText = 'display:flex;align-items:center;height:28px;padding:0 8px;cursor:pointer;gap:6px;font-size:11px;color:var(--text-secondary);';
    subHdr.innerHTML = '<i data-lucide="chevron-right" width="8" height="8" stroke-width="1.5"></i>' +
      '<span style="flex:1;">' + grp.label + '</span>' +
      (active.length ? '<span style="font-size:9px;color:var(--accent);">' + active.join('·') + '</span>' : '');
    var subBody = document.createElement('div');
    subBody.style.display = active.length ? '' : 'none';

    grp.tags.forEach(function(tag) {
      var label = OT_LABELS[tag] || tag;
      var val = !!otf[tag];
      var rowEl = document.createElement('div');
      rowEl.className = 'toggle-row';
      rowEl.style.paddingLeft = '20px';
      rowEl.innerHTML = '<span class="toggle-label" style="font-size:11px;">' + escHtml(label) + '</span>' +
        '<span class="toggle-tag">' + tag + '</span>' +
        '<div class="toggle-btn' + (val ? ' on' : '') + '">' + (val ? '✓' : '—') + '</div>';
      rowEl.addEventListener('click', function() {
        var btn = rowEl.querySelector('.toggle-btn');
        var on = !btn.classList.contains('on');
        btn.classList.toggle('on', on);
        btn.textContent = on ? '✓' : '—';
        var patch = state.editPatches.openTypeFeatures || {};
        patch[tag] = on;
        state.editPatches.openTypeFeatures = patch;
        markDirty();
      });
      subBody.appendChild(rowEl);
    });

    subHdr.addEventListener('click', function() {
      var open = subBody.style.display !== 'none';
      subBody.style.display = open ? 'none' : '';
      subHdr.classList.toggle('open', !open);
    });
    subWrap.appendChild(subHdr);
    subWrap.appendChild(subBody);
    wrap.appendChild(subWrap);
  });
  return wrap;
}

// ── Paint form ─────────────────────────────────────────────────────────────
function buildPaintForm(body, style) {
  var wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex;flex-direction:column;';

  function renderPaints(paints) {
    wrap.innerHTML = '';
    paints.forEach(function(paint, idx) {
      wrap.appendChild(buildPaintLayer(paint, idx, paints, renderPaints));
    });
    var addBtn = document.createElement('div');
    addBtn.className = 'add-layer-btn';
    addBtn.innerHTML = '<i data-lucide="plus" width="12" height="12" stroke-width="1.5"></i>Add fill';
    addBtn.addEventListener('click', function() {
      var newPaints = paints.concat([{ type: 'SOLID', color: { r: 0.5, g: 0.5, b: 0.5 }, opacity: 1, blendMode: 'NORMAL', visible: true }]);
      setPatch('paints', newPaints);
      renderPaints(newPaints);
    });
    wrap.appendChild(addBtn);
    state.editPatches.paints = paints;
    if (window.lucide) lucide.createIcons();
  }

  renderPaints(JSON.parse(JSON.stringify(style.paints || [])));
  body.appendChild(wrap);
}

function buildPaintLayer(paint, idx, allPaints, renderPaints) {
  var div = document.createElement('div');
  div.className = 'paint-layer';
  var hdr = document.createElement('div');
  hdr.className = 'layer-header';

  var typeLabel = paint.type === 'SOLID' ? 'Solid' :
    paint.type === 'GRADIENT_LINEAR' ? 'Linear gradient' :
    paint.type === 'GRADIENT_RADIAL' ? 'Radial gradient' :
    paint.type === 'IMAGE' ? 'Image' : paint.type;

  var swStyle = '';
  if (paint.type === 'SOLID') {
    var c = paint.color;
    swStyle = 'background:rgba(' + Math.round(c.r*255) + ',' + Math.round(c.g*255) + ',' + Math.round(c.b*255) + ',' + (paint.opacity||1) + ');';
  }

  hdr.innerHTML =
    '<div class="drag-handle"><i data-lucide="grip-horizontal" width="10" height="10" stroke-width="1.5"></i></div>' +
    '<div class="vis-btn' + (!paint.visible ? ' hidden-vis' : '') + '" title="Toggle visibility">' +
      '<i data-lucide="eye" width="12" height="12" stroke-width="1.5"></i>' +
    '</div>' +
    '<div class="swatch" style="' + swStyle + '" title="Edit color"></div>' +
    '<span style="flex:1;font-size:11px;">' + escHtml(typeLabel) + '</span>' +
    '<span style="font-size:11px;color:var(--text-muted);margin-right:4px;">' + Math.round((paint.opacity||1)*100) + '%</span>' +
    '<button style="color:var(--text-muted);width:20px;height:20px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);" class="del-layer-btn" title="Remove">' +
      '<i data-lucide="x" width="10" height="10" stroke-width="1.5"></i>' +
    '</button>';

  // expanded props
  var expEl = document.createElement('div');
  expEl.className = 'layer-expanded';
  expEl.style.display = 'none';
  expEl.appendChild(buildBlendRow(paint, idx, allPaints, renderPaints));
  if (paint.type === 'SOLID') expEl.appendChild(buildSolidEditor(paint, idx, allPaints, renderPaints));

  hdr.querySelector('.swatch').addEventListener('click', function(e) {
    e.stopPropagation();
    var sw = hdr.querySelector('.swatch');
    openColorPicker(null, sw, paint.color, paint.opacity, function(color, opacity) {
      allPaints[idx] = Object.assign({}, allPaints[idx], { color: color, opacity: opacity });
      setPatch('paints', allPaints);
      renderPaints(allPaints);
    });
  });
  hdr.querySelector('.vis-btn').addEventListener('click', function(e) {
    e.stopPropagation();
    allPaints[idx] = Object.assign({}, allPaints[idx], { visible: !allPaints[idx].visible });
    setPatch('paints', allPaints); renderPaints(allPaints);
  });
  hdr.querySelector('.del-layer-btn').addEventListener('click', function(e) {
    e.stopPropagation();
    allPaints.splice(idx, 1);
    setPatch('paints', allPaints); renderPaints(allPaints);
  });
  hdr.addEventListener('click', function(e) {
    if (e.target.closest('.swatch') || e.target.closest('.vis-btn') || e.target.closest('.del-layer-btn')) return;
    var open = expEl.style.display !== 'none';
    expEl.style.display = open ? 'none' : '';
  });

  div.appendChild(hdr);
  div.appendChild(expEl);
  return div;
}

function buildBlendRow(paint, idx, allPaints, renderPaints) {
  var row = document.createElement('div');
  row.className = 'form-row';
  row.innerHTML = '<span class="form-label">Blend</span>' +
    '<select class="input form-control">' +
    ['NORMAL','MULTIPLY','SCREEN','OVERLAY','DARKEN','LIGHTEN','COLOR_DODGE','COLOR_BURN',
     'HARD_LIGHT','SOFT_LIGHT','DIFFERENCE','EXCLUSION','HUE','SATURATION','COLOR','LUMINOSITY'].map(function(m) {
      return '<option' + (paint.blendMode === m ? ' selected' : '') + ' value="' + m + '">' + m.replace(/_/g,' ') + '</option>';
    }).join('') +
    '</select>';
  row.querySelector('select').addEventListener('change', function() {
    allPaints[idx] = Object.assign({}, allPaints[idx], { blendMode: this.value });
    setPatch('paints', allPaints);
  });
  return row;
}

function buildSolidEditor(paint, idx, allPaints, renderPaints) {
  var div = document.createElement('div');
  div.className = 'form-row';
  var c = paint.color;
  var hex = rgbToHex(c.r, c.g, c.b);
  var op = Math.round((paint.opacity || 1) * 100);
  div.innerHTML = '<span class="form-label">Color</span>' +
    '<div class="flex-row form-control">' +
    '<input class="input" id="solid-hex-' + idx + '" value="' + hex.toUpperCase() + '" style="width:90px;" maxlength="7" spellcheck="false">' +
    '<input class="input" id="solid-op-' + idx + '" type="number" min="0" max="100" value="' + op + '" style="width:56px;">' +
    '<span class="muted" style="font-size:11px;">%</span>' +
    '</div>';
  setTimeout(function() {
    var hexInp = el('solid-hex-' + idx);
    var opInp  = el('solid-op-' + idx);
    if (!hexInp) return;
    hexInp.addEventListener('change', function() {
      try {
        var rgb = hexToRgb(this.value);
        allPaints[idx] = Object.assign({}, allPaints[idx], { color: rgb });
        setPatch('paints', allPaints);
      } catch(e) {}
    });
    opInp.addEventListener('change', function() {
      allPaints[idx] = Object.assign({}, allPaints[idx], { opacity: clamp(parseFloat(this.value) || 100, 0, 100) / 100 });
      setPatch('paints', allPaints);
    });
  }, 0);
  return div;
}

// ── Effect form ────────────────────────────────────────────────────────────
function buildEffectForm(body, style) {
  var wrap = document.createElement('div');

  function renderEffects(effects) {
    wrap.innerHTML = '';
    effects.forEach(function(eff, idx) {
      wrap.appendChild(buildEffectLayer(eff, idx, effects, renderEffects));
    });
    var addBtn = document.createElement('div');
    addBtn.className = 'add-layer-btn';
    addBtn.innerHTML = '<i data-lucide="plus" width="12" height="12" stroke-width="1.5"></i>Add effect';
    var menu = document.createElement('div');
    menu.className = 'dropdown';
    menu.innerHTML = ['DROP_SHADOW','INNER_SHADOW','LAYER_BLUR','BACKGROUND_BLUR'].map(function(t) {
      return '<div class="dropdown-item" data-etype="' + t + '">' + t.replace(/_/g,' ').toLowerCase().replace(/^\w/,function(c){return c.toUpperCase();}) + '</div>';
    }).join('');
    addBtn.appendChild(menu);
    addBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      menu.style.position = 'fixed';
      var r = addBtn.getBoundingClientRect();
      menu.style.top = r.bottom + 'px'; menu.style.left = r.left + 'px';
      menu.classList.toggle('visible');
    });
    qsa('[data-etype]', menu).forEach(function(item) {
      item.addEventListener('click', function() {
        menu.classList.remove('visible');
        var ne = { type: item.dataset.etype, visible: true };
        if (item.dataset.etype === 'DROP_SHADOW' || item.dataset.etype === 'INNER_SHADOW') {
          Object.assign(ne, { color: { r:0,g:0,b:0,a:0.25 }, offset: {x:0,y:2}, radius: 4, spread: 0, blendMode: 'NORMAL', showShadowBehindNode: false });
        } else {
          Object.assign(ne, { radius: 4, blurType: 'NORMAL' });
        }
        var newEffects = effects.concat([ne]);
        setPatch('effects', newEffects); renderEffects(newEffects);
      });
    });
    wrap.appendChild(addBtn);
    state.editPatches.effects = effects;
    if (window.lucide) lucide.createIcons();
  }

  renderEffects(JSON.parse(JSON.stringify(style.effects || [])));
  body.appendChild(wrap);
}

function buildEffectLayer(eff, idx, allEffects, renderEffects) {
  var div = document.createElement('div');
  div.className = 'effect-layer';
  var typeLabel = eff.type.replace(/_/g,' ').toLowerCase().replace(/^\w/,function(c){return c.toUpperCase();});
  var hdr = document.createElement('div');
  hdr.className = 'layer-header';
  hdr.innerHTML = '<div class="vis-btn" title="Visibility"><i data-lucide="eye" width="12" height="12" stroke-width="1.5"></i></div>' +
    '<span style="flex:1;font-size:11px;">' + escHtml(typeLabel) + '</span>' +
    '<button class="del-layer-btn" style="color:var(--text-muted);width:20px;height:20px;display:flex;align-items:center;justify-content:center;" title="Remove"><i data-lucide="x" width="10" height="10" stroke-width="1.5"></i></button>';

  var expEl = document.createElement('div');
  expEl.className = 'layer-expanded';
  expEl.style.display = 'none';

  if (eff.type === 'DROP_SHADOW' || eff.type === 'INNER_SHADOW') {
    expEl.appendChild(buildShadowEditor(eff, idx, allEffects, eff.type === 'DROP_SHADOW'));
  } else if (eff.type === 'LAYER_BLUR' || eff.type === 'BACKGROUND_BLUR') {
    expEl.appendChild(buildBlurEditor(eff, idx, allEffects));
  }

  hdr.querySelector('.vis-btn').addEventListener('click', function(e) {
    e.stopPropagation();
    allEffects[idx] = Object.assign({}, allEffects[idx], { visible: !allEffects[idx].visible });
    setPatch('effects', allEffects); renderEffects(allEffects);
  });
  hdr.querySelector('.del-layer-btn').addEventListener('click', function(e) {
    e.stopPropagation();
    allEffects.splice(idx, 1); setPatch('effects', allEffects); renderEffects(allEffects);
  });
  hdr.addEventListener('click', function(e) {
    if (e.target.closest('.vis-btn') || e.target.closest('.del-layer-btn')) return;
    expEl.style.display = expEl.style.display === 'none' ? '' : 'none';
  });

  div.appendChild(hdr); div.appendChild(expEl);
  return div;
}

function numRow(label, key, val, eff, idx, allEffects) {
  var row = document.createElement('div');
  row.className = 'form-row';
  row.innerHTML = '<span class="form-label">' + escHtml(label) + '</span>' +
    '<input class="input form-control" type="number" step="1" value="' + (val || 0) + '">';
  row.querySelector('input').addEventListener('change', function() {
    allEffects[idx] = Object.assign({}, allEffects[idx]);
    if (key.indexOf('.') > 0) {
      var parts = key.split('.');
      allEffects[idx][parts[0]] = Object.assign({}, allEffects[idx][parts[0]]);
      allEffects[idx][parts[0]][parts[1]] = parseFloat(this.value) || 0;
    } else {
      allEffects[idx][key] = parseFloat(this.value) || 0;
    }
    setPatch('effects', allEffects);
  });
  return row;
}

function buildShadowEditor(eff, idx, allEffects, hasBehind) {
  var frag = document.createDocumentFragment();
  // color row
  var colorRow = document.createElement('div');
  colorRow.className = 'form-row';
  var c = eff.color || {r:0,g:0,b:0,a:0.25};
  var hex = rgbToHex(c.r, c.g, c.b);
  var op = Math.round((c.a || 0.25) * 100);
  colorRow.innerHTML = '<span class="form-label">Color</span>' +
    '<div class="flex-row form-control">' +
    '<div class="swatch" style="background:rgba(' + Math.round(c.r*255) + ',' + Math.round(c.g*255) + ',' + Math.round(c.b*255) + ',' + c.a + ');" id="shad-sw-' + idx + '"></div>' +
    '<input class="input" value="' + hex.toUpperCase() + '" style="width:80px;" id="shad-hex-' + idx + '">' +
    '<input class="input" type="number" min="0" max="100" value="' + op + '" style="width:56px;" id="shad-op-' + idx + '">%' +
    '</div>';
  frag.appendChild(colorRow);
  frag.appendChild(numRow('X offset', 'offset.x', eff.offset && eff.offset.x, eff, idx, allEffects));
  frag.appendChild(numRow('Y offset', 'offset.y', eff.offset && eff.offset.y, eff, idx, allEffects));
  frag.appendChild(numRow('Blur', 'radius', eff.radius, eff, idx, allEffects));
  frag.appendChild(numRow('Spread', 'spread', eff.spread, eff, idx, allEffects));
  setTimeout(function() {
    var hexI = el('shad-hex-' + idx);
    var opI  = el('shad-op-' + idx);
    if (!hexI) return;
    function update() {
      try {
        var rgb = hexToRgb(hexI.value);
        var a = clamp((parseFloat(opI.value) || 0) / 100, 0, 1);
        allEffects[idx] = Object.assign({}, allEffects[idx], { color: Object.assign({}, rgb, { a: a }) });
        setPatch('effects', allEffects);
      } catch(e) {}
    }
    hexI.addEventListener('change', update);
    opI.addEventListener('change', update);
  }, 0);
  return frag;
}

function buildBlurEditor(eff, idx, allEffects) {
  var frag = document.createDocumentFragment();
  frag.appendChild(numRow('Blur radius', 'radius', eff.radius, eff, idx, allEffects));
  return frag;
}

// ── Bulk panel ─────────────────────────────────────────────────────────────
function updateBulkPanel() {
  var ids = selectedIds();
  var panel = el('bulk-panel');
  if (ids.length < 2) { panel.classList.remove('active'); return; }
  panel.classList.add('active');
  el('bulk-title').textContent = ids.length + ' ' + state.activeTab.toLowerCase() + ' style' + (ids.length !== 1 ? 's' : '') + ' selected';
  el('btn-apply-bulk').textContent = 'Apply to ' + ids.length + ' styles →';

  var styles = stylesByTab().filter(function(s) { return ids.indexOf(s.id) >= 0; });
  var body = el('bulk-body');
  body.innerHTML = '';

  if (state.activeTab === 'TEXT') buildTextBulkRows(body, styles);
  if (state.activeTab === 'PAINT') buildPaintBulkRows(body, styles);
}

function mixedVal(styles, getter) {
  var vals = styles.map(getter);
  var first = JSON.stringify(vals[0]);
  return vals.every(function(v) { return JSON.stringify(v) === first; }) ? vals[0] : null;
}

function buildTextBulkRows(body, styles) {
  var bulkPatches = Object.create(null);

  function addRow(label, key, controlFn) {
    var row = document.createElement('div');
    row.className = 'bulk-field-row';
    var cb = document.createElement('div');
    cb.className = 'cb'; cb.style.flexShrink = '0';
    var lbl = document.createElement('span');
    lbl.className = 'bulk-field-label'; lbl.textContent = label;
    var mixed = mixedVal(styles, function(s) { return s[key]; });
    var pill = document.createElement('span');
    pill.className = 'bulk-mixed-pill';
    pill.textContent = mixed !== null ? String(mixed) : 'mixed';
    var ctrl = document.createElement('div');
    ctrl.className = 'bulk-control';
    ctrl.style.opacity = '0.4'; ctrl.style.pointerEvents = 'none';
    controlFn(ctrl, function(val) { bulkPatches[key] = val; });

    cb.addEventListener('click', function() {
      var on = !cb.classList.contains('checked');
      cb.classList.toggle('checked', on);
      ctrl.style.opacity = on ? '' : '0.4';
      ctrl.style.pointerEvents = on ? '' : 'none';
      if (!on) delete bulkPatches[key];
    });
    row.appendChild(cb); row.appendChild(lbl); row.appendChild(pill); row.appendChild(ctrl);
    body.appendChild(row);
  }

  addRow('Font Family', 'fontFamily', function(ctrl, set) {
    ctrl.innerHTML = '<input class="input" value="" style="width:120px;" placeholder="Family…">';
    ctrl.querySelector('input').addEventListener('change', function() { set(this.value); });
  });
  addRow('Font Style', 'fontStyle', function(ctrl, set) {
    ctrl.innerHTML = '<input class="input" value="" style="width:100px;" placeholder="Style…">';
    ctrl.querySelector('input').addEventListener('change', function() { set(this.value); });
  });
  addRow('Font Size', 'fontSize', function(ctrl, set) {
    ctrl.innerHTML = '<input class="input" type="number" min="1" step="1" value="" style="width:64px;"><span class="muted" style="font-size:11px;margin-left:4px;">px</span>';
    ctrl.querySelector('input').addEventListener('change', function() { set(parseFloat(this.value) || 12); });
  });

  el('btn-apply-bulk').onclick = function() {
    var ids = selectedIds();
    var patches = bulkPatches;
    if (!Object.keys(patches).length) { toast('No changes selected', 'warning'); return; }
    var changes = ids.map(function(id) { return { id: id, styleType: state.activeTab, patches: Object.assign({}, patches) }; });
    confirm(
      'Apply ' + Object.keys(patches).length + ' change(s) to ' + ids.length + ' styles?',
      Object.keys(patches).map(function(k) { return k + ' → ' + JSON.stringify(patches[k]); }).join('\n'),
      'Note: changes may not be undoable with Ctrl+Z in all cases.',
      'Apply', 'primary',
      function() { postMsg({ type: 'applyChanges', changes: changes }); }
    );
  };
}

function buildPaintBulkRows(body, styles) {
  var bulkPatches = Object.create(null);
  var row = document.createElement('div');
  row.className = 'bulk-field-row';
  row.innerHTML = '<span class="bulk-field-label" style="color:var(--text-muted);">Select a solid color style to bulk-change color and opacity.</span>';
  body.appendChild(row);

  el('btn-apply-bulk').onclick = function() {
    var ids = selectedIds();
    if (!Object.keys(bulkPatches).length) { toast('No changes selected', 'warning'); return; }
    var changes = ids.map(function(id) { return { id: id, styleType: state.activeTab, patches: Object.assign({}, bulkPatches) }; });
    confirm('Apply to ' + ids.length + ' styles?', '', 'Note: changes may not be undoable.', 'Apply', 'primary',
      function() { postMsg({ type: 'applyChanges', changes: changes }); }
    );
  };
}

el('btn-cancel-bulk').addEventListener('click', function() {
  state.selected = Object.create(null);
  renderList();
});
el('btn-close-bulk').addEventListener('click', function() {
  state.selected = Object.create(null);
  renderList();
});

// ── Color picker (mini) ────────────────────────────────────────────────────
var picker = {
  active: false, hue: 0, sat: 1, bri: 1, alpha: 1,
  onCommit: null, rgbOnly: false
};

function openColorPicker(styleObj, anchor, initColor, initOpacity, onCommit) {
  var cp = el('color-picker');
  picker.onCommit = onCommit;
  picker.alpha = initOpacity !== undefined ? initOpacity : 1;
  if (initColor) {
    var h = rgbToHsv(initColor.r, initColor.g, initColor.b);
    picker.hue = h.h; picker.sat = h.s; picker.bri = h.v;
  }
  drawPickerCanvas();
  drawHueSlider();
  drawAlphaSlider();
  updatePickerHex();

  var rect = anchor.getBoundingClientRect();
  cp.style.top  = (rect.bottom + 4) + 'px';
  cp.style.left = Math.min(rect.left, window.innerWidth - 256) + 'px';
  cp.classList.add('visible');
  picker.active = true;
}

function closeColorPicker() {
  el('color-picker').classList.remove('visible');
  picker.active = false;
}

document.addEventListener('click', function(e) {
  if (picker.active && !e.target.closest('#color-picker') && !e.target.closest('.swatch')) {
    closeColorPicker();
  }
});

function rgbToHsv(r, g, b) {
  var max = Math.max(r,g,b), min = Math.min(r,g,b), d = max - min;
  var h = 0, s = max === 0 ? 0 : d/max, v = max;
  if (d !== 0) {
    if (max === r) h = ((g-b)/d + (g<b?6:0)) / 6;
    else if (max === g) h = ((b-r)/d + 2) / 6;
    else h = ((r-g)/d + 4) / 6;
  }
  return { h: h, s: s, v: v };
}
function hsvToRgb(h, s, v) {
  var i = Math.floor(h*6), f = h*6-i, p = v*(1-s), q = v*(1-f*s), t = v*(1-(1-f)*s);
  var r,g,b;
  switch(i%6){ case 0:r=v;g=t;b=p;break; case 1:r=q;g=v;b=p;break; case 2:r=p;g=v;b=t;break; case 3:r=p;g=q;b=v;break; case 4:r=t;g=p;b=v;break; default:r=v;g=p;b=q; }
  return { r: r, g: g, b: b };
}

function drawPickerCanvas() {
  var canvas = el('picker-canvas');
  var ctx = canvas.getContext('2d');
  var w = canvas.width, h = canvas.height;
  var hsl = 'hsl(' + Math.round(picker.hue * 360) + ',100%,50%)';
  var gradH = ctx.createLinearGradient(0,0,w,0);
  gradH.addColorStop(0, '#fff'); gradH.addColorStop(1, hsl);
  ctx.fillStyle = gradH; ctx.fillRect(0,0,w,h);
  var gradV = ctx.createLinearGradient(0,0,0,h);
  gradV.addColorStop(0,'rgba(0,0,0,0)'); gradV.addColorStop(1,'rgba(0,0,0,1)');
  ctx.fillStyle = gradV; ctx.fillRect(0,0,w,h);
  var cx = picker.sat * w, cy = (1 - picker.bri) * h;
  ctx.beginPath(); ctx.arc(cx, cy, 6, 0, Math.PI*2);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
}

function drawHueSlider() {
  var canvas = el('picker-hue');
  var ctx = canvas.getContext('2d');
  var grad = ctx.createLinearGradient(0,0,canvas.width,0);
  for (var i=0; i<=6; i++) grad.addColorStop(i/6, 'hsl(' + (i*60) + ',100%,50%)');
  ctx.fillStyle = grad; ctx.fillRect(0,0,canvas.width,canvas.height);
  var x = picker.hue * canvas.width;
  ctx.beginPath(); ctx.arc(x, canvas.height/2, 5, 0, Math.PI*2);
  ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
}

function drawAlphaSlider() {
  var canvas = el('picker-alpha');
  var ctx = canvas.getContext('2d');
  var rgb = hsvToRgb(picker.hue, picker.sat, picker.bri);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  var checker = ctx.createPattern((function() {
    var c = document.createElement('canvas'); c.width=8; c.height=8;
    var cx = c.getContext('2d');
    cx.fillStyle='#888'; cx.fillRect(0,0,4,4); cx.fillRect(4,4,4,4);
    cx.fillStyle='#aaa'; cx.fillRect(4,0,4,4); cx.fillRect(0,4,4,4);
    return c;
  })(), 'repeat');
  ctx.fillStyle = checker; ctx.fillRect(0,0,canvas.width,canvas.height);
  var grad = ctx.createLinearGradient(0,0,canvas.width,0);
  grad.addColorStop(0,'rgba('+Math.round(rgb.r*255)+','+Math.round(rgb.g*255)+','+Math.round(rgb.b*255)+',0)');
  grad.addColorStop(1,'rgba('+Math.round(rgb.r*255)+','+Math.round(rgb.g*255)+','+Math.round(rgb.b*255)+',1)');
  ctx.fillStyle=grad; ctx.fillRect(0,0,canvas.width,canvas.height);
  var x = picker.alpha * canvas.width;
  ctx.beginPath(); ctx.arc(x, canvas.height/2, 5, 0, Math.PI*2);
  ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
}

function updatePickerHex() {
  var rgb = hsvToRgb(picker.hue, picker.sat, picker.bri);
  el('picker-hex').value = rgbToHex(rgb.r, rgb.g, rgb.b).toUpperCase();
}

function commitPickerColor() {
  var rgb = hsvToRgb(picker.hue, picker.sat, picker.bri);
  if (picker.onCommit) picker.onCommit(rgb, picker.alpha);
}

(function() {
  var canvas = el('picker-canvas');
  function onPickerDrag(e) {
    var rect = canvas.getBoundingClientRect();
    picker.sat = clamp((e.clientX - rect.left) / rect.width, 0, 1);
    picker.bri = clamp(1 - (e.clientY - rect.top) / rect.height, 0, 1);
    drawPickerCanvas(); drawAlphaSlider(); updatePickerHex(); commitPickerColor();
  }
  canvas.addEventListener('mousedown', function(e) {
    onPickerDrag(e);
    function move(e) { onPickerDrag(e); }
    function up() { document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); }
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  });

  var hueC = el('picker-hue');
  function onHueDrag(e) {
    var rect = hueC.getBoundingClientRect();
    picker.hue = clamp((e.clientX - rect.left) / rect.width, 0, 1);
    drawPickerCanvas(); drawHueSlider(); drawAlphaSlider(); updatePickerHex(); commitPickerColor();
  }
  hueC.addEventListener('mousedown', function(e) {
    onHueDrag(e);
    function move(e) { onHueDrag(e); }
    function up() { document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); }
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  });

  var alphaC = el('picker-alpha');
  function onAlphaDrag(e) {
    var rect = alphaC.getBoundingClientRect();
    picker.alpha = clamp((e.clientX - rect.left) / rect.width, 0, 1);
    drawAlphaSlider(); commitPickerColor();
  }
  alphaC.addEventListener('mousedown', function(e) {
    onAlphaDrag(e);
    function move(e) { onAlphaDrag(e); }
    function up() { document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); }
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  });

  el('picker-hex').addEventListener('change', function() {
    try {
      var rgb = hexToRgb(this.value);
      var h = rgbToHsv(rgb.r, rgb.g, rgb.b);
      picker.hue = h.h; picker.sat = h.s; picker.bri = h.v;
      drawPickerCanvas(); drawHueSlider(); drawAlphaSlider(); commitPickerColor();
    } catch(e) {}
  });
})();

// ── Keyboard navigation ────────────────────────────────────────────────────
document.addEventListener('keydown', function(e) {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;

  if (e.key === 'Escape') {
    if (el('edit-panel').classList.contains('active')) { el('btn-back').click(); return; }
    if (state.searchQuery) { el('search-input').value = ''; state.searchQuery = ''; renderList(); return; }
    if (selectedIds().length) { state.selected = Object.create(null); renderList(); return; }
  }

  if ((e.metaKey || e.ctrlKey) && e.key === 'a') {
    e.preventDefault();
    var visible = filterStyles(stylesByTab()).filter(function(s) { return !s.remote; });
    visible.forEach(function(s) { state.selected[s.id] = true; });
    renderList();
    return;
  }

  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
    if (el('edit-panel').classList.contains('active')) el('btn-save-edit').click();
    return;
  }

  // focus search on printable key
  if (e.key.length === 1 && !e.metaKey && !e.ctrlKey && !e.altKey) {
    el('search-input').focus();
  }
});

// ── Settings toggle (density) ──────────────────────────────────────────────
el('btn-settings').addEventListener('click', function() {
  state.density = state.density === 'compact' ? 'comfortable' : 'compact';
  localStorage.setItem('bse-density', state.density);
  renderList();
  toast('Density: ' + state.density);
});

function buildMeta(s) {
  if (s.type === 'TEXT') {
    return escHtml(s.fontFamily) + ' · ' + escHtml(s.fontStyle) + ' · ' + s.fontSize + 'px';
  }
  if (s.type === 'PAINT') {
    var p = s.paints && s.paints[0];
    if (!p) return 'No fills';
    if (p.type === 'SOLID') {
      var hex = rgbToHex(p.color.r, p.color.g, p.color.b);
      var op = Math.round((p.opacity !== undefined ? p.opacity : 1) * 100);
      return escHtml(hex.toUpperCase()) + (op < 100 ? ' · ' + op + '%' : '');
    }
    if (p.type === 'GRADIENT_LINEAR') return 'Linear gradient · ' + (p.gradientStops ? p.gradientStops.length : 0) + ' stops';
    if (p.type === 'GRADIENT_RADIAL') return 'Radial gradient';
    if (p.type === 'GRADIENT_ANGULAR') return 'Angular gradient';
    if (p.type === 'IMAGE') return 'Image fill';
    if (p.type === 'VIDEO') return 'Video fill';
    if (p.type === 'PATTERN') return 'Pattern fill';
    return p.type;
  }
  if (s.type === 'EFFECT') {
    if (!s.effects || !s.effects.length) return 'No effects';
    var names = s.effects.map(function(e) {
      if (e.type === 'DROP_SHADOW') return 'Drop shadow';
      if (e.type === 'INNER_SHADOW') return 'Inner shadow';
      if (e.type === 'LAYER_BLUR') return 'Layer blur';
      if (e.type === 'BACKGROUND_BLUR') return 'Bg blur';
      return e.type;
    });
    return escHtml(names.join(' + '));
  }
  if (s.type === 'GRID') {
    var g = s.layoutGrids && s.layoutGrids[0];
    if (!g) return 'No grids';
    if (g.pattern === 'GRID') return 'Grid · ' + g.sectionSize + 'px';
    return escHtml(g.pattern.charAt(0) + g.pattern.slice(1).toLowerCase()) + ' · ' + g.count + ' · ' + g.gutterSize + 'px gutter';
  }
  return '';
}
