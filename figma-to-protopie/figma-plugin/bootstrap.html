<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        font: 12px/1.5 sans-serif;
      }
      #help {
        padding: 18px;
      }
      iframe {
        position: fixed;
        inset: 0;
        border: 0;
        width: 100%;
        height: 100%;
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <div id="help">
      <strong>Start the local helper</strong>
      <p>
        Run Start-Plugin.cmd in the plugin folder, then reopen this plugin. Keep the helper running
        while you import.
      </p>
    </div>
    <iframe id="panel" title="Figma to ProtoPie" src="http://localhost:9983/"></iframe>
    <script>
      const panel = document.getElementById("panel")
      const localOrigin = "http://localhost:9983"
      const themeColors = [
        "bg",
        "bg-secondary",
        "bg-hover",
        "border",
        "border-strong",
        "text",
        "text-secondary",
        "text-tertiary",
        "text-onbrand",
        "bg-brand",
        "bg-brand-hover",
        "text-danger",
        "text-warning",
        "text-success",
      ]
      let lastTheme = ""
      function sendTheme(force = false) {
        const root = document.documentElement
        const style = getComputedStyle(root)
        const variables = {}
        for (const color of themeColors) {
          const name = `--figma-color-${color}`
          const value = style.getPropertyValue(name).trim()
          if (value) variables[name] = value
        }
        const colorScheme = root.classList.contains("figma-dark")
          ? "dark"
          : root.classList.contains("figma-light")
            ? "light"
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
        const theme = { variables, colorScheme }
        const serialized = JSON.stringify(theme)
        if (force || serialized !== lastTheme) {
          panel.contentWindow.postMessage({ figmaTheme: theme }, localOrigin)
          lastTheme = serialized
        }
      }
      panel.addEventListener("load", () => sendTheme(true))
      const themeObserver = new MutationObserver(() => sendTheme())
      themeObserver.observe(document.documentElement, {
        attributes: true,
        attributeFilter: ["class", "style"],
      })
      themeObserver.observe(document.head, { childList: true, subtree: true, characterData: true })
      matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => sendTheme())
      function fromFigmaHost(event) {
        if (!["https://www.figma.com", "https://figma.com", "null"].includes(event.origin))
          return false
        // Figma can send directly from above its sandbox wrapper, rather than parent.
        // Accept only actual ancestors; matching an origin alone is insufficient.
        let frame = parent
        for (let depth = 0; frame && depth < 16; depth++) {
          if (event.source === frame) return true
          const next = frame.parent
          if (next === frame) break
          frame = next
        }
        return false
      }
      window.addEventListener("message", (event) => {
        if (
          event.source === panel.contentWindow &&
          event.origin === localOrigin &&
          event.data?.pluginMessage
        ) {
          sendTheme()
          panel.style.visibility = "visible"
          parent.postMessage({ pluginMessage: event.data.pluginMessage }, "*")
        } else if (fromFigmaHost(event) && event.data?.pluginMessage) {
          panel.contentWindow.postMessage({ pluginMessage: event.data.pluginMessage }, localOrigin)
        }
      })
    </script>
  </body>
</html>
