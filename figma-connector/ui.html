<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figma Connector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root {
  /* Sourced from Figma's own injected theme (figma.showUI({ themeColors: true })),
     so this plugin's colors auto-match the user's actual light/dark Figma theme
     instead of a guessed fixed palette. Fallbacks only apply if that ever fails. */
  --color-bg:             var(--figma-color-bg, #2C2C2C);
  --color-bg-secondary:   var(--figma-color-bg-secondary, #383838);
  --color-border:         var(--figma-color-border, #444444);
  --color-border-strong:  var(--figma-color-border-strong, #555555);
  --color-text:           var(--figma-color-text, #FFFFFF);
  --color-text-secondary: var(--figma-color-text-secondary, rgba(255,255,255,0.7));
  --color-text-tertiary:  var(--figma-color-text-tertiary, rgba(255,255,255,0.4));
  --color-text-onbrand:   var(--figma-color-text-onbrand, #FFFFFF);
  --color-bg-brand:       var(--figma-color-bg-brand, #0C8CE9);
  --color-bg-brand-hover: var(--figma-color-bg-brand-hover, #006dcf);
  --color-danger:         var(--figma-color-text-danger, #ff6b6b);

  --font-title-size: 12px;
  --font-title-lh:   16px;
  --font-body-size:  11px;
  --font-body-lh:    16px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
  font-size: var(--font-body-size);
  line-height: var(--font-body-lh);
  background: var(--color-bg);
  color: var(--color-text);
  -webkit-user-select: none;
  user-select: none;
}

.plugin-wrap {
  display: flex;
  flex-direction: column;
  background: var(--color-bg);
  min-height: 100vh;
}

.content-header {
  padding: 12px 16px 6px;
  flex-shrink: 0;
}
.header-title {
  font-weight: 600;
  font-size: var(--font-title-size);
  line-height: var(--font-title-lh);
}

.step { display: flex; flex-direction: column; padding: 10px 16px 12px; gap: 8px; }

.tip {
  padding: 8px 10px;
  background: var(--color-bg-secondary);
  border-radius: 6px;
  border: 1px solid var(--color-border);
  font-size: var(--font-body-size);
  color: var(--color-text-secondary);
  line-height: var(--font-body-lh);
}
.tip b { color: var(--color-text); font-weight: 500; }

.instructions {
  font-size: var(--font-body-size);
  color: var(--color-text-secondary);
  line-height: var(--font-body-lh);
}

.status-box {
  padding: 8px 10px;
  background: var(--color-bg-secondary);
  border-radius: 6px;
  border: 1px solid var(--color-border);
  font-size: var(--font-body-size);
  color: var(--color-text-secondary);
  line-height: var(--font-body-lh);
  word-break: break-word;
}
.status-box.ready { color: var(--color-text); }
.status-box.warn { color: var(--color-danger); }

.primary-btn {
  background: var(--color-bg-brand);
  border: none;
  border-radius: 6px;
  color: var(--color-text-onbrand);
  font-size: var(--font-body-size);
  font-weight: 500;
  font-family: inherit;
  padding: 8px 14px;
  cursor: pointer;
  transition: background 0.1s, opacity 0.1s;
}
.primary-btn:hover:not(:disabled) { background: var(--color-bg-brand-hover); }
.primary-btn:disabled { opacity: 0.4; cursor: not-allowed; }

.secondary-btn {
  background: transparent;
  border: 1px solid var(--color-border);
  border-radius: 6px;
  color: var(--color-text);
  font-size: var(--font-body-size);
  font-family: inherit;
  padding: 7px 12px;
  cursor: pointer;
  transition: background 0.1s, border-color 0.1s;
}
.secondary-btn:hover { background: var(--color-bg-secondary); border-color: var(--color-border-strong); }
.secondary-btn.full-width { width: 100%; }

.divider { height: 1px; background: var(--color-border); margin: 0 16px; }

.section-label {
  font-size: var(--font-body-size);
  color: var(--color-text-secondary);
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.row-between > span:first-child { color: var(--color-text-secondary); }

/* ── Toggle switch ── */
.switch { position: relative; display: inline-block; width: 28px; height: 16px; flex-shrink: 0; }
.switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.switch-track { position: absolute; inset: 0; background: var(--color-border-strong); border-radius: 999px; transition: background 0.15s; pointer-events: none; }
.switch-thumb { position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; background: #fff; border-radius: 50%; transition: transform 0.15s; }
.switch input:checked + .switch-track { background: var(--color-bg-brand); }
.switch input:checked + .switch-track .switch-thumb { transform: translateX(12px); }

/* ── Style row: color + weight + apply ── */
.style-row { display: flex; align-items: center; gap: 8px; }
.color-input {
  width: 24px;
  height: 24px;
  padding: 0;
  border: 1px solid var(--color-border);
  border-radius: 4px;
  background: none;
  cursor: pointer;
  flex-shrink: 0;
}
.weight-slider { flex: 1; accent-color: var(--color-bg-brand); cursor: pointer; }
.weight-value { width: 20px; color: var(--color-text-secondary); text-align: right; flex-shrink: 0; }

/* ── Log panel ── */
.log-section {
  border-top: 1px solid var(--color-border);
  padding: 10px 16px 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex-shrink: 0;
}
.log-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.copy-btn {
  display: flex;
  align-items: center;
  gap: 5px;
  background: transparent;
  border: 1px solid var(--color-border);
  border-radius: 5px;
  color: var(--color-text-secondary);
  font-size: var(--font-body-size);
  font-family: inherit;
  padding: 4px 8px;
  cursor: pointer;
  transition: background 0.1s, color 0.1s;
}
.copy-btn:hover { background: var(--color-bg-secondary); color: var(--color-text); }
.copy-btn svg { flex-shrink: 0; }
.copy-btn.copied { color: var(--color-bg-brand); border-color: var(--color-bg-brand); }

.log-list {
  max-height: 130px;
  overflow-y: auto;
  background: var(--color-bg-secondary);
  border: 1px solid var(--color-border);
  border-radius: 6px;
  padding: 8px 10px;
  font-family: 'JetBrains Mono', Consolas, monospace;
  font-size: var(--font-body-size);
  line-height: var(--font-body-lh);
}
.log-empty { color: var(--color-text-secondary); }
.log-entry { color: var(--color-text-secondary); white-space: pre-wrap; word-break: break-word; }
.log-entry.error { color: var(--color-danger); }
.log-entry .log-time { color: var(--color-text-tertiary); margin-right: 6px; }
</style>
</head>
<body>
<div class="plugin-wrap" id="plugin-wrap">

  <div class="content-header">
    <span class="header-title">Figma Connector</span>
  </div>

  <div class="step">
    <div class="tip">
      <b>Ctrl+C</b> your styled connector once, then <b>Ctrl+V</b> a copy for each new connection.
    </div>
    <div class="instructions">
      Select the copy plus the two elements to connect, then click Connect.
    </div>
    <div class="status-box" id="status">Nothing selected</div>
    <button type="button" class="primary-btn" id="connect-btn" disabled>Connect Selected</button>
  </div>

  <div class="divider"></div>

  <!-- Manage Connectors: visibility / color / weight for every connector on the page -->
  <div class="step">
    <span class="section-label">Manage Connectors</span>

    <div class="row-between">
      <span>Show connector arrows</span>
      <label class="switch">
        <input type="checkbox" id="visibility-toggle" checked aria-label="Show connector arrows">
        <span class="switch-track"><span class="switch-thumb"></span></span>
      </label>
    </div>

    <div class="style-row">
      <input type="color" class="color-input" id="color-picker" value="#0D99FF" aria-label="Connector color" title="Connector color">
      <input type="range" class="weight-slider" id="weight-slider" min="0.5" max="10" step="0.5" value="2" aria-label="Connector stroke weight" title="Connector stroke weight">
      <span class="weight-value" id="weight-value">2</span>
      <button type="button" class="secondary-btn" id="apply-style-btn">Apply</button>
    </div>

    <button type="button" class="secondary-btn full-width" id="randomize-btn">Randomize colors</button>

    <div class="status-box" id="connector-count-status">0 connectors on this page</div>
  </div>

  <!-- Logs -->
  <div class="log-section">
    <div class="log-header">
      <span class="section-label">Log</span>
      <button type="button" class="copy-btn" id="copy-log-btn">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="4" y="4" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.1"/>
          <path d="M2.5 8V2.5C2.5 1.94772 2.94772 1.5 3.5 1.5H8" stroke="currentColor" stroke-width="1.1"/>
        </svg>
        <span id="copy-log-label">Copy</span>
      </button>
    </div>
    <div class="log-list" id="log-list">
      <div class="log-empty">No actions yet.</div>
    </div>
  </div>

</div>

<script>
var statusBox = document.getElementById('status');
var connectBtn = document.getElementById('connect-btn');
var logList = document.getElementById('log-list');
var copyLogBtn = document.getElementById('copy-log-btn');
var copyLogLabel = document.getElementById('copy-log-label');
var pluginWrap = document.getElementById('plugin-wrap');
var visibilityToggle = document.getElementById('visibility-toggle');
var colorPicker = document.getElementById('color-picker');
var weightSlider = document.getElementById('weight-slider');
var weightValue = document.getElementById('weight-value');
var applyStyleBtn = document.getElementById('apply-style-btn');
var randomizeBtn = document.getElementById('randomize-btn');
var connectorCountStatus = document.getElementById('connector-count-status');

var logEntries = []; // { time, level, message }

connectBtn.addEventListener('click', function () {
  parent.postMessage({ pluginMessage: { type: 'connect' } }, '*');
});
copyLogBtn.addEventListener('click', copyLogs);

visibilityToggle.addEventListener('change', function () {
  parent.postMessage({ pluginMessage: { type: 'toggle-visibility', show: visibilityToggle.checked } }, '*');
});
weightSlider.addEventListener('input', function () {
  weightValue.textContent = weightSlider.value;
});
applyStyleBtn.addEventListener('click', function () {
  parent.postMessage({ pluginMessage: { type: 'apply-style', color: colorPicker.value, weight: Number(weightSlider.value) } }, '*');
});
randomizeBtn.addEventListener('click', function () {
  parent.postMessage({ pluginMessage: { type: 'randomize-colors' } }, '*');
});

window.onmessage = function (event) {
  var msg = event.data.pluginMessage;
  if (!msg) return;
  if (msg.type === 'selection-status') render(msg);
  if (msg.type === 'connector-state') renderConnectorState(msg);
  if (msg.type === 'log') addLogEntry(msg);
};

function renderConnectorState(state) {
  visibilityToggle.checked = state.shown;
  connectorCountStatus.textContent = state.count + ' connector' + (state.count === 1 ? '' : 's') + ' on this page';
  scheduleResize();
}

function render(status) {
  connectBtn.disabled = !status.canConnect;

  if (status.count === 0) {
    statusBox.textContent = 'Nothing selected';
    statusBox.className = 'status-box';
  } else if (status.canConnect) {
    statusBox.textContent = 'Selected: ' + status.names.join(', ');
    statusBox.className = 'status-box ready';
  } else if (status.connectorCount === 0) {
    statusBox.textContent = 'No connector in selection — paste one first (Ctrl+V).';
    statusBox.className = 'status-box warn';
  } else if (status.connectorCount > 1) {
    statusBox.textContent = 'More than one connector selected — select only one.';
    statusBox.className = 'status-box warn';
  } else {
    statusBox.textContent = 'Select exactly 3 items: 1 connector + 2 elements (currently ' + status.count + ' selected).';
    statusBox.className = 'status-box warn';
  }
  scheduleResize();
}

function addLogEntry(entry) {
  logEntries.push(entry);
  var row = document.createElement('div');
  row.className = 'log-entry' + (entry.level === 'error' ? ' error' : '');
  var timeSpan = document.createElement('span');
  timeSpan.className = 'log-time';
  timeSpan.textContent = entry.time;
  row.appendChild(timeSpan);
  row.appendChild(document.createTextNode(entry.message));

  if (logList.querySelector('.log-empty')) logList.innerHTML = '';
  logList.appendChild(row);
  logList.scrollTop = logList.scrollHeight;
}

function copyLogs() {
  var text = logEntries.length
    ? logEntries.map(function (e) { return '[' + e.time + '] ' + (e.level === 'error' ? 'ERROR: ' : '') + e.message; }).join('\n')
    : 'No actions yet.';

  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try {
    document.execCommand('copy');
    copyLogLabel.textContent = 'Copied';
    copyLogBtn.classList.add('copied');
    setTimeout(function () {
      copyLogLabel.textContent = 'Copy';
      copyLogBtn.classList.remove('copied');
    }, 1200);
  } catch (e) {
    copyLogLabel.textContent = 'Failed';
  }
  document.body.removeChild(ta);
}

// Auto-resize the plugin window to fit content (capped in code.js between 280–700px)
var resizeTimer = null;
function scheduleResize() {
  if (resizeTimer) return;
  resizeTimer = setTimeout(function () {
    resizeTimer = null;
    var h = pluginWrap.getBoundingClientRect().height;
    parent.postMessage({ pluginMessage: { type: 'resize', height: Math.ceil(h) } }, '*');
  }, 30);
}

new ResizeObserver(scheduleResize).observe(pluginWrap);
scheduleResize();
</script>
</body>
</html>
